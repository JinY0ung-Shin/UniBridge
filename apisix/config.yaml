apisix:
  node_listen:
    - ip: 0.0.0.0
      port: 9080
  enable_admin: true
  enable_ipv6: false

deployment:
  admin:
    admin_key:
      - name: admin
        key: "${{APISIX_ADMIN_KEY}}"
        role: admin
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    allow_admin:
      - 127.0.0.1/32
      - 172.16.0.0/12   # Docker internal networks
  etcd:
    host:
      - "http://etcd:2379"

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
    # NOTE: `prefer_name` (label metrics by route/service *name* instead of id)
    # is NOT a plugin_attr key — APISIX reads it from the prometheus *plugin*
    # conf. It is set on the `prometheus` global rule in
    # unibridge-service/app/main.py; putting it here has no effect.

plugins:
  - key-auth
  - consumer-restriction
  - limit-count
  - proxy-rewrite
  - prometheus
