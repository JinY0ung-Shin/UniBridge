# HTTPS front for the Bifrost UI (bifrost-tls service), which the "Bifrost"
# button on the LLM Monitoring page opens. Bifrost serves plain HTTP only, and
# browsers that saw this host's HSTS header refuse plain http:// to it.
#
# Allowlist, not a pass-through: only what the Bifrost UI itself loads goes to
# bifrost:8080 — its pages, static files, the management API (/api/, behind the
# Bifrost admin login) and the /ws live-update socket. Inference (/v1/*,
# /openai/*, /anthropic/*, …), MCP (/mcp) and the unauthenticated /metrics get
# a 404 here: model traffic enters through the gateway's /api/llm-bi routes
# only. The one UI feature this costs is the prompt playground's Run button,
# which calls /v1/chat/completions straight from the browser.

map $http_upgrade $connection_upgrade {
    default "";
    "websocket" "upgrade";
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    client_max_body_size 100m;
    # No add_header: Bifrost already sends HSTS, X-Frame-Options,
    # X-Content-Type-Options and Referrer-Policy, and a second copy with a
    # different value would conflict.

    # Plain HTTP sent to this TLS port: redirect to https on the port the
    # client used ($server_port would be the container's 443).
    error_page 497 =301 https://$http_host$request_uri;

    # Resolve bifrost at request time, so this proxy starts (and its health
    # check passes) while Bifrost itself is down or being recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bifrost_upstream "bifrost:8080";

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # The UI streams some management responses; don't hold them back.
    proxy_buffering off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # UI pages: client-side routes that Bifrost answers with its index.html.
    location = / {
        proxy_pass http://$bifrost_upstream;
    }
    location ~ ^/(login|workspace|oauth|agent|pprof)(/|$) {
        proxy_pass http://$bifrost_upstream;
    }

    # Static files: hashed bundles, fonts, images, and root-level icons/logos.
    location ^~ /assets/ {
        proxy_pass http://$bifrost_upstream;
    }
    location ^~ /static/ {
        proxy_pass http://$bifrost_upstream;
    }
    location ^~ /images/ {
        proxy_pass http://$bifrost_upstream;
    }
    location ~ ^/[A-Za-z0-9._-]+\.(ico|png|svg|webp)$ {
        proxy_pass http://$bifrost_upstream;
    }

    # Management API, guarded by Bifrost's own admin login.
    location ^~ /api/ {
        proxy_pass http://$bifrost_upstream;
    }

    # Live log / MCP updates; the socket can stay quiet for a long time.
    location = /ws {
        proxy_pass http://$bifrost_upstream;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
