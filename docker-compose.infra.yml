x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

name: ${UNIBRIDGE_INFRA_PROJECT:-unibridge-infra}

services:
  etcd:
    # Upstream CoreOS etcd. This replaced bitnamilegacy/etcd:3.5.11: Bitnami
    # moved its free images to that archive in Aug 2025, so the old tag is
    # frozen and gets no security updates — and etcd is the only store of every
    # APISIX route, upstream and consumer.
    image: quay.io/coreos/etcd:v3.5.33
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: "0.50"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.50"
    environment:
      # The data directory deliberately keeps the Bitnami layout
      # (/bitnami/etcd/data on the etcd-data volume). Same 3.5 minor, same
      # on-disk format, so an existing volume migrates in place on the next
      # `up` — no export/import, no route re-provisioning.
      - ETCD_DATA_DIR=/bitnami/etcd/data
      - ETCD_NAME=etcd
      - ETCD_INITIAL_CLUSTER=etcd=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      # Healthcheck credentials only. `etcdctl endpoint health` is rejected
      # once auth is on unless it authenticates, and the server ignores these
      # while auth is still off, so one value covers both states. The Bitnami
      # image already kept the root password in this container's environment.
      - ETCDCTL_USER=root:${ETCD_ROOT_PASSWORD:-}
    expose:
      - "2379"
    volumes:
      - etcd-data:/bitnami/etcd
    healthcheck:
      # Exec form on purpose: the upstream image is distroless and has no shell.
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - apihub-net

  # One-shot: creates the etcd root user and enables authentication, the job
  # the Bitnami image did from ALLOW_NONE_AUTHENTICATION/ETCD_ROOT_PASSWORD.
  # Idempotent — compose re-runs it on every `up`. Also the image
  # backup/lib/etcd.sh runs snapshot save/restore from (ETCD_TOOLS_IMAGE).
  etcd-init:
    build: ./etcd
    image: unibridge-etcd-tools:3.5.33
    restart: "no"
    logging: *default-logging
    mem_limit: 64m
    cpus: "0.25"
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
      - ETCD_ROOT_PASSWORD=${ETCD_ROOT_PASSWORD:-}
      - ETCD_ALLOW_NONE_AUTH=${ETCD_ALLOW_NONE_AUTH:-no}
    depends_on:
      etcd:
        condition: service_healthy
    networks:
      - apihub-net

  apisix:
    image: apache/apisix:3.15.0-debian
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: "1.00"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.00"
    entrypoint: /opt/apisix-config/docker-entrypoint.sh
    expose:
      - "9080"
    ports:
      - "127.0.0.1:${APISIX_ADMIN_PORT:-9180}:9180"
    environment:
      - APISIX_ADMIN_KEY=${APISIX_ADMIN_KEY:?APISIX_ADMIN_KEY is required}
      - ETCD_USERNAME=root
      - ETCD_PASSWORD=${ETCD_ROOT_PASSWORD:-}
    volumes:
      - ./apisix/config.yaml:/opt/apisix-config/config.yaml:ro
      - ./apisix/docker-entrypoint.sh:/opt/apisix-config/docker-entrypoint.sh:ro
      # Custom plugin listed in config.yaml; APISIX loads plugins from here.
      - ./apisix/plugins/unibridge-node-path-prefix.lua:/usr/local/apisix/apisix/plugins/unibridge-node-path-prefix.lua:ro
    depends_on:
      etcd:
        condition: service_healthy
      # Never talk to an etcd whose auth bootstrap has not finished: APISIX
      # would connect unauthenticated, succeed, and then start failing the
      # moment etcd-init flips auth on.
      etcd-init:
        condition: service_completed_successfully
    networks:
      - apihub-net

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: "0.50"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KC_DB_USER:-keycloak}
      - POSTGRES_PASSWORD=${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER:-keycloak} -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apihub-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    cpus: "1.00"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.00"
    entrypoint: /opt/init/docker-entrypoint.sh
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD is required}
      - KC_HTTPS_PORT=8443
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/conf/tls.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/conf/tls.key
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=${KC_DB_USER:-keycloak}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
      - KEYCLOAK_SERVICE_CLIENT_ID=${KEYCLOAK_SERVICE_CLIENT_ID:-apihub-service}
      - KEYCLOAK_SERVICE_CLIENT_SECRET=${KEYCLOAK_SERVICE_CLIENT_SECRET:?KEYCLOAK_SERVICE_CLIENT_SECRET is required}
      - HOST_IP=${HOST_IP:-localhost}
      - UNIBRIDGE_UI_PORT=${UNIBRIDGE_EDGE_PORT:-${UNIBRIDGE_UI_PORT:-3000}}
      - KEYCLOAK_REDIRECT_URI=${KEYCLOAK_REDIRECT_URI:-}
      - KEYCLOAK_WEB_ORIGIN=${KEYCLOAK_WEB_ORIGIN:-}
      - KEYCLOAK_DEV_MODE=${KEYCLOAK_DEV_MODE:-false}
      # Grafana SSO client: secret lands in the realm template on first import,
      # redirect URI is kept in sync by the entrypoint on every boot.
      - GRAFANA_OAUTH_CLIENT_SECRET=${GRAFANA_OAUTH_CLIENT_SECRET:?GRAFANA_OAUTH_CLIENT_SECRET is required}
      # LiteLLM admin-UI SSO client: same first-import/boot-sync pattern as
      # Grafana; LITELLM_PORT feeds the derived /sso/callback redirect URI.
      - LITELLM_OAUTH_CLIENT_SECRET=${LITELLM_OAUTH_CLIENT_SECRET:?LITELLM_OAUTH_CLIENT_SECRET is required}
      - LITELLM_PORT=${LITELLM_PORT:-4000}
    ports:
      - "${KEYCLOAK_PORT:-8443}:8443"
    volumes:
      - ./keycloak/realm-export.json:/opt/init/realm-export.json.tpl:ro
      - ./keycloak/docker-entrypoint.sh:/opt/init/docker-entrypoint.sh:ro
      - ${TLS_CERT_PATH:-./certs/tls.crt}:/opt/keycloak/conf/tls.crt:ro
      - ${TLS_KEY_PATH:-./certs/tls.key}:/opt/keycloak/conf/tls.key:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8443"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - apihub-net

  prometheus:
    image: prom/prometheus:v3.11.1
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: "0.50"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=60d'
    ports:
      # Loopback by default: external PromQL access rides the gateway route
      # /api/prometheus/* (key-auth, per-key grants) instead of a raw port.
      # Set PROMETHEUS_BIND=0.0.0.0 to expose the port directly if ever needed.
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-file-sd:/etc/prometheus/file_sd:ro
      - prometheus-data:/prometheus
    depends_on:
      apisix:
        condition: service_started
      blackbox-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - apihub-net

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    cpus: "0.25"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    expose:
      - "9115"
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9115/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - apihub-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    cpus: "0.25"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    # Routes Prometheus's fired rules to the unibridge-service webhook, which
    # reuses the app's owner/admin email pipeline. Alertmanager does not expand
    # env vars in its config, so render a writable copy at startup and exec the
    # binary against it ($$ escapes compose interpolation so the container shell
    # expands it). Two stages:
    #   1. Strip the optional SMTP fallback unless ALERTMANAGER_SMTP_HOST and
    #      ALERTMANAGER_SMTP_TO are both set — deleting its two marker blocks
    #      keeps the rendered config valid in either mode. The SMTP password is
    #      written to a file read via auth_password_file instead of being
    #      substituted: `|`, `&` or `\` in a password corrupts a sed
    #      replacement silently.
    #   2. Substitute the placeholders. When ALERTMANAGER_WEBHOOK_TOKEN is unset
    #      the literal placeholder stays as the credential (valid, non-empty)
    #      and the app returns 503 for the endpoint — alerts stay visible in the
    #      Alertmanager UI but no mail goes out until the operator sets the
    #      token (the app logs that reason once per process).
    # umask 077 covers both rendered files, which carry the bearer token and the
    # SMTP password. See alertmanager/alertmanager.yml.
    # Keep this block identical in docker-compose.yml and docker-compose.infra.yml.
    entrypoint:
      - /bin/sh
      - -c
      - >
        umask 077
        && if [ -n "$${ALERTMANAGER_SMTP_HOST}" ] && [ -n "$${ALERTMANAGER_SMTP_TO}" ];
        then printf '%s' "$${ALERTMANAGER_SMTP_PASSWORD}" > /tmp/alertmanager-smtp-password
        && cp /etc/alertmanager/alertmanager.yml /tmp/alertmanager.src;
        else sed -e '/# BEGIN smtp-fallback-route/,/# END smtp-fallback-route/d'
        -e '/# BEGIN smtp-fallback-receiver/,/# END smtp-fallback-receiver/d'
        /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.src;
        fi
        && sed -e "s|__ALERTMANAGER_WEBHOOK_TOKEN__|$${ALERTMANAGER_WEBHOOK_TOKEN:-__ALERTMANAGER_WEBHOOK_TOKEN__}|g"
        -e "s|__ALERTMANAGER_SMTP_HOST__|$${ALERTMANAGER_SMTP_HOST}|g"
        -e "s|__ALERTMANAGER_SMTP_PORT__|$${ALERTMANAGER_SMTP_PORT:-25}|g"
        -e "s|__ALERTMANAGER_SMTP_FROM__|$${ALERTMANAGER_SMTP_FROM:-alertmanager@unibridge.local}|g"
        -e "s|__ALERTMANAGER_SMTP_TO__|$${ALERTMANAGER_SMTP_TO}|g"
        -e "s|__ALERTMANAGER_SMTP_USERNAME__|$${ALERTMANAGER_SMTP_USERNAME}|g"
        -e "s|__ALERTMANAGER_SMTP_REQUIRE_TLS__|$${ALERTMANAGER_SMTP_REQUIRE_TLS:-true}|g"
        /tmp/alertmanager.src > /tmp/alertmanager.yml
        && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      - ALERTMANAGER_WEBHOOK_TOKEN=${ALERTMANAGER_WEBHOOK_TOKEN:-}
      # App-independent mail path for the service-down alerts. Empty host or
      # recipient disables it (both fallback blocks are stripped at render).
      - ALERTMANAGER_SMTP_HOST=${ALERTMANAGER_SMTP_HOST:-}
      - ALERTMANAGER_SMTP_PORT=${ALERTMANAGER_SMTP_PORT:-}
      - ALERTMANAGER_SMTP_FROM=${ALERTMANAGER_SMTP_FROM:-}
      - ALERTMANAGER_SMTP_TO=${ALERTMANAGER_SMTP_TO:-}
      - ALERTMANAGER_SMTP_USERNAME=${ALERTMANAGER_SMTP_USERNAME:-}
      - ALERTMANAGER_SMTP_PASSWORD=${ALERTMANAGER_SMTP_PASSWORD:-}
      - ALERTMANAGER_SMTP_REQUIRE_TLS=${ALERTMANAGER_SMTP_REQUIRE_TLS:-}
    expose:
      - "9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9093/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - apihub-net

  grafana:
    image: grafana/grafana-oss:12.4.3
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: "0.50"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.50"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/unibridge-overview.json
      # Served same-origin behind the edge/UI nginx at /grafana (TLS terminates
      # there); the host port below stays loopback-only for debugging.
      - GF_SERVER_ROOT_URL=https://${HOST_IP:-localhost}:${UNIBRIDGE_EDGE_PORT:-${UNIBRIDGE_UI_PORT:-3000}}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # SSO via the UniBridge Keycloak realm. Browser-facing auth_url derives
      # from HOST_IP like every other external URL; the server-side token
      # exchange uses Keycloak's in-network HTTP listener. api_url is omitted
      # on purpose: user info comes from the id_token, which avoids Keycloak's
      # userinfo issuer check tripping on the internal/external hostname split.
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=UniBridge SSO
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OAUTH_CLIENT_SECRET:?GRAFANA_OAUTH_CLIENT_SECRET is required}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://${HOST_IP:-localhost}:${KEYCLOAK_PORT:-8443}/realms/${KEYCLOAK_REALM:-apihub}/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://keycloak:8080/realms/${KEYCLOAK_REALM:-apihub}/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      # Admin-only: non-admins resolve to no role and strict mode rejects the
      # login (no Viewer fallback) — Grafana can't enforce per-key scoping.
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(realm_access.roles[*], 'admin') && 'Admin'
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=true
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - apihub-net

  litellm-db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: "0.50"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD is required}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apihub-net

  unibridge-db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: "0.50"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    environment:
      - POSTGRES_DB=unibridge
      - POSTGRES_USER=unibridge
      - POSTGRES_PASSWORD=${UNIBRIDGE_DB_PASSWORD:?UNIBRIDGE_DB_PASSWORD is required}
    volumes:
      - unibridge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unibridge -d unibridge"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apihub-net

  litellm:
    image: ghcr.io/berriai/litellm:v1.102.1
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    cpus: "1.00"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.00"
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -z "$$PROXY_BASE_URL" ]; then
          export PROXY_BASE_URL="https://$$HOST_IP:$$LITELLM_PORT"
        fi
        exec litellm --config /app/config.yaml --port 4000 \
          --ssl_certfile_path /etc/ssl/tls.crt --ssl_keyfile_path /etc/ssl/tls.key
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD is required}@litellm-db:5432/litellm
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      - LITELLM_LOG=ERROR
      - STORE_MODEL_IN_DB=true
      - FORWARDED_ALLOW_IPS=*
      - SSL_VERIFY=${SSL_VERIFY:-true}
      - HOST_IP=${HOST_IP:-localhost}
      - LITELLM_PORT=${LITELLM_PORT:-4000}
      - PROXY_BASE_URL=${PROXY_BASE_URL:-}
      # Admin-UI SSO via the UniBridge Keycloak realm. The browser-facing
      # authorize URL derives from HOST_IP; the server-side token exchange
      # uses Keycloak's in-network HTTP listener (same internal/external
      # split as the Grafana env block).
      - GENERIC_CLIENT_ID=litellm
      - GENERIC_CLIENT_SECRET=${LITELLM_OAUTH_CLIENT_SECRET:?LITELLM_OAUTH_CLIENT_SECRET is required}
      - GENERIC_AUTHORIZATION_ENDPOINT=https://${HOST_IP:-localhost}:${KEYCLOAK_PORT:-8443}/realms/${KEYCLOAK_REALM:-apihub}/protocol/openid-connect/auth
      - GENERIC_TOKEN_ENDPOINT=http://keycloak:8080/realms/${KEYCLOAK_REALM:-apihub}/protocol/openid-connect/token
      - GENERIC_USERINFO_ENDPOINT=http://keycloak:8080/realms/${KEYCLOAK_REALM:-apihub}/protocol/openid-connect/userinfo
      # PKCE is load-bearing, not just hardening: it switches LiteLLM to its
      # own token-exchange path, which falls back to id_token claims when the
      # userinfo endpoint rejects the token. Keycloak pins the token issuer to
      # the browser-facing host, so userinfo via the in-network listener always
      # 401s (the same trap Grafana avoids by omitting api_url) — without PKCE
      # the login 500s on that userinfo response.
      - GENERIC_CLIENT_USE_PKCE=true
      # UniBridge admins usually hold a live Keycloak session, so /ui flows
      # straight through SSO; non-admins carry no `role` claim and are
      # rejected by ui_access_mode admin_only (litellm/config.yaml).
      - AUTO_REDIRECT_UI_LOGIN_TO_SSO=true
      # Fine-tuning dataset capture dir, written by custom_callbacks.py.
      - LITELLM_DATASET_DIR=/var/lib/litellm-dataset
      # Retention for that capture (both 0 = unlimited, the default). Enforced
      # opportunistically inside custom_callbacks.py; see README.md "LLM
      # conversation capture". The dataset volume is intentionally not a backup
      # target (backup/README.md), so these are its only size bound.
      - LITELLM_DATASET_RETENTION_DAYS=${LITELLM_DATASET_RETENTION_DAYS:-0}
      - LITELLM_DATASET_MAX_TOTAL_BYTES=${LITELLM_DATASET_MAX_TOTAL_BYTES:-0}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ${TLS_CERT_PATH:-./certs/tls.crt}:/etc/ssl/tls.crt:ro
      - ${TLS_KEY_PATH:-./certs/tls.key}:/etc/ssl/tls.key:ro
      # Custom callback module referenced by litellm/config.yaml as
      # `callbacks: custom_callbacks.proxy_handler_instance`; LiteLLM imports it
      # by dotted path from its WORKDIR (/app). config.yaml is shared with the
      # single-stack layout, so this mount must exist wherever that config runs.
      - ./litellm/custom_callbacks.py:/app/custom_callbacks.py:ro
      - litellm-dataset:/var/lib/litellm-dataset
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import ssl,urllib.request;urllib.request.urlopen('https://localhost:4000/health/liveliness', context=ssl._create_unverified_context())\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - apihub-net

  # ── Bifrost, side by side with LiteLLM (/api/llm-bi) ──
  # Part of the default stack: a plain `up` starts it, and the blue/green
  # deploy's infra health gate requires it healthy like any infra service.
  # /api/llm stays on LiteLLM; unibridge-service installs the /api/llm-bi
  # routes while BIFROST_GATEWAY_ROUTES is on. These three services are
  # identical in docker-compose.yml and docker-compose.infra.yml (tested).
  bifrost:
    image: maximhq/bifrost:v2.2.6
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    cpus: "1.00"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.00"
    # Compose refuses to start without the secrets config.json references;
    # bifrost/entrypoint.sh also checks their format, then hands off to the
    # image's own entrypoint.
    entrypoint: ["/bin/sh", "/app/bundle/entrypoint.sh"]
    command: ["/app/main"]
    environment:
      - BIFROST_ENCRYPTION_KEY=${BIFROST_ENCRYPTION_KEY:?BIFROST_ENCRYPTION_KEY is required}
      - BIFROST_ADMIN_USERNAME=${BIFROST_ADMIN_USERNAME:-admin}
      - BIFROST_ADMIN_PASSWORD=${BIFROST_ADMIN_PASSWORD:?BIFROST_ADMIN_PASSWORD is required}
      # The one virtual key Bifrost accepts on inference (config.json
      # enforce_auth_on_inference); APISIX injects it on the /api/llm-bi routes,
      # so nothing that bypasses the gateway gets an answer.
      - BIFROST_TEST_VK=${BIFROST_TEST_VK:?BIFROST_TEST_VK is required}
      - LOG_LEVEL=${BIFROST_LOG_LEVEL:-info}
      - LOG_STYLE=json
      # Go soft memory limit at ~90% of mem_limit, so GC tightens before the
      # cgroup OOM-kills the process (request-body logging is the big consumer).
      - GOMEMLIMIT=900MiB
    ports:
      # Loopback only, plain HTTP: the management API for curl on the host.
      # Browsers reach the UI through bifrost-tls below. The gateway forwards
      # only the /api/llm-bi inference paths, and inference here needs the
      # gateway's virtual key.
      - "127.0.0.1:${BIFROST_TEST_ADMIN_PORT:-18080}:8080"
    volumes:
      - bifrost-test-data:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
      # entrypoint.sh plus the empty pricing / model-parameters datasheets that
      # config.json loads over file:// — Bifrost cannot boot offline without
      # them, and self-hosted models have no list price anyway.
      - ./bifrost:/app/bundle:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - apihub-net

  # HTTPS front for the Bifrost UI, which the "Bifrost" button on the LLM
  # Monitoring page opens at https://HOST_IP:BIFROST_UI_PORT (Bifrost itself
  # serves plain HTTP only). bifrost/tls-proxy.conf forwards the UI pages, the
  # management API (behind the Bifrost admin login) and the live-update socket,
  # but not inference or /metrics: model traffic enters through the gateway's
  # /api/llm-bi routes only.
  bifrost-tls:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    cpus: "0.25"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    ports:
      - "${BIFROST_UI_PORT:-18443}:443"
    volumes:
      - ./bifrost/tls-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:-./certs/tls.crt}:/etc/nginx/ssl/tls.crt:ro
      - ${TLS_KEY_PATH:-./certs/tls.key}:/etc/nginx/ssl/tls.key:ro
    depends_on:
      # Not service_healthy: the proxy resolves bifrost per request, so it can
      # start (and report healthy) while Bifrost is still booting.
      bifrost:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O- https://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - apihub-net

  # Second converter in front of Bifrost, so /api/llm-bi/v1/messages and
  # /v1/responses get exactly the translation /api/llm gets; only the upstream
  # differs. Same build context as llm-converter.
  llm-converter-bi:
    image: llm-converter:bifrost-test
    build:
      context: ./llm-converter
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    init: true
    logging: *default-logging
    mem_limit: 512m
    cpus: "0.50"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    environment:
      # Always in front of Bifrost, whatever LLM_GATEWAY says for /api/llm.
      # Bifrost serves plain HTTP on the internal network (it has no TLS
      # listener), so there is no CA to pin.
      - LLM_GATEWAY=bifrost
      - LITELLM_URL=http://bifrost:8080
      - CONVERTER_TLS_CA=
      - CONVERTER_TLS_VERIFY=false
      # Everything below mirrors llm-converter, so both paths run on the same knobs.
      - CONVERTER_REQUEST_TIMEOUT=${CONVERTER_REQUEST_TIMEOUT:-0}
      - CONVERTER_CONNECT_TIMEOUT=${CONVERTER_CONNECT_TIMEOUT:-10}
      - CONVERTER_WRITE_TIMEOUT=${CONVERTER_WRITE_TIMEOUT:-120}
      - CONVERTER_POOL_TIMEOUT=${CONVERTER_POOL_TIMEOUT:-10}
      - CONVERTER_SSE_HEARTBEAT_SECONDS=${CONVERTER_SSE_HEARTBEAT_SECONDS:-15}
      - CONVERTER_RESPONSE_STORE_PATH=${CONVERTER_RESPONSE_STORE_PATH:-/var/lib/llm-converter/responses.sqlite3}
      - CONVERTER_RESPONSE_STORE_TTL=${CONVERTER_RESPONSE_STORE_TTL:-3600}
      - CONVERTER_RESPONSE_STORE_MAX=${CONVERTER_RESPONSE_STORE_MAX:-10000}
      - CONVERTER_RESPONSE_STORE_MAX_BYTES=${CONVERTER_RESPONSE_STORE_MAX_BYTES:-67108864}
      - CONVERTER_RESPONSE_STORE_MAX_ENTRY_BYTES=${CONVERTER_RESPONSE_STORE_MAX_ENTRY_BYTES:-16777216}
      - CONVERTER_EMIT_REASONING=${CONVERTER_EMIT_REASONING:-true}
      - CONVERTER_LENGTH_AS_COMPLETED=${CONVERTER_LENGTH_AS_COMPLETED:-auto}
      - CONVERTER_FLATTEN_NAMESPACE_TOOLS=${CONVERTER_FLATTEN_NAMESPACE_TOOLS:-true}
      - CONVERTER_REASONING_EFFORT_LEVELS=${CONVERTER_REASONING_EFFORT_LEVELS:-low,medium,high}
      - CONVERTER_TRACE=${CONVERTER_TRACE:-false}
      - CONVERTER_MID_SYSTEM_POLICY=${CONVERTER_MID_SYSTEM_POLICY:-user}
      - CONVERTER_MID_SYSTEM_MODEL_PATTERN=${CONVERTER_MID_SYSTEM_MODEL_PATTERN:-}
    expose:
      - "4001"
    volumes:
      # Its own previous_response_id store: a response id minted on one path
      # must not resolve on the other.
      - llm-converter-bi-state:/var/lib/llm-converter
    depends_on:
      bifrost:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - apihub-net

networks:
  apihub-net:
    name: ${UNIBRIDGE_NETWORK_NAME:-unibridge-net}
    driver: bridge

volumes:
  etcd-data:
    name: ${ETCD_DATA_VOLUME:-unibridge_etcd-data}
  prometheus-data:
    name: ${PROMETHEUS_DATA_VOLUME:-unibridge_prometheus-data}
  alertmanager-data:
    name: ${ALERTMANAGER_DATA_VOLUME:-unibridge_alertmanager-data}
  prometheus-file-sd:
    name: ${PROMETHEUS_FILE_SD_VOLUME:-unibridge_prometheus-file-sd}
  grafana-data:
    name: ${GRAFANA_DATA_VOLUME:-unibridge_grafana-data}
  keycloak-db-data:
    name: ${KEYCLOAK_DB_DATA_VOLUME:-unibridge_keycloak-db-data}
  litellm-db-data:
    name: ${LITELLM_DB_DATA_VOLUME:-unibridge_litellm-db-data}
  # Same volume name as the single-stack layout's default, so a capture started
  # under docker-compose.yml carries over to the split stack (and vice versa).
  litellm-dataset:
    name: ${LITELLM_DATASET_VOLUME:-unibridge_litellm-dataset}
  unibridge-db-data:
    name: ${UNIBRIDGE_DB_DATA_VOLUME:-unibridge_unibridge-db-data}
  # Bifrost (see the bifrost service). Same names as the single-stack
  # defaults, so its data carries across layouts.
  bifrost-test-data:
    name: ${BIFROST_TEST_DATA_VOLUME:-unibridge_bifrost-test-data}
  llm-converter-bi-state:
    name: ${LLM_CONVERTER_BI_STATE_VOLUME:-unibridge_llm-converter-bi-state}
