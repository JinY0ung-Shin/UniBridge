# Bifrost UI on a host name of its own (BIFROST_UI_HOSTNAME), on this server's
# port. entrypoint.sh renders this file into conf.d only when that variable is
# set. Bifrost's UI builds every URL from the root of its origin (/api, /assets,
# /ws, /login) and has no base-path setting, so it cannot live under a path of
# the UniBridge origin, whose /api and /assets it would collide with. A host
# name gives it an origin, and cookies, of its own: on a shared IP its "token"
# cookie and the LiteLLM admin UI's cookie of the same name overwrite each
# other. The blue-green edge passes the Host header through, so this server
# answers in that layout too.
#
# The locations are bifrost/tls-proxy.conf's allowlist, kept identical by
# unibridge-service/tests/test_deployment_security.py: the UI pages, static
# files, the management API (behind Bifrost's admin login) and the /ws socket.
# Inference, MCP and /metrics get a 404; model traffic enters through the
# gateway's /api/llm-bi routes only.

# With the default 64-byte buckets nginx refuses any server_name longer than 46
# characters and does not start, taking the whole UniBridge port down with it.
# 512 fits the longest DNS name (253). Being in this file, it is set only when
# the Bifrost server exists.
server_names_hash_bucket_size 512;

server {
    listen 443 ssl;
    server_name __BIFROST_UI_HOSTNAME__;

    ssl_certificate /etc/nginx/ssl/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    client_max_body_size 100m;
    # No add_header: Bifrost already sends HSTS, X-Frame-Options,
    # X-Content-Type-Options and Referrer-Policy, and a second copy with a
    # different value would conflict.

    # Plain HTTP sent to this TLS port: redirect to https on the port the
    # client used ($server_port would be the container's 443).
    error_page 497 =301 https://$http_host$request_uri;

    # Resolve bifrost at request time, so this server starts while Bifrost is
    # down or being recreated (requests get a 502 until it is back).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bifrost_upstream "bifrost:8080";

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # The UI streams some management responses; don't hold them back.
    proxy_buffering off;

    # UI pages: client-side routes that Bifrost answers with its index.html.
    location = / {
        proxy_pass http://$bifrost_upstream;
    }
    location ~ ^/(login|workspace|oauth|agent|pprof)(/|$) {
        proxy_pass http://$bifrost_upstream;
    }

    # Static files: hashed bundles, fonts, images, and root-level icons/logos.
    location ^~ /assets/ {
        proxy_pass http://$bifrost_upstream;
    }
    location ^~ /static/ {
        proxy_pass http://$bifrost_upstream;
    }
    location ^~ /images/ {
        proxy_pass http://$bifrost_upstream;
    }
    location ~ ^/[A-Za-z0-9._-]+\.(ico|png|svg|webp)$ {
        proxy_pass http://$bifrost_upstream;
    }

    # Management API, guarded by Bifrost's own admin login.
    location ^~ /api/ {
        proxy_pass http://$bifrost_upstream;
    }

    # Live log / MCP updates; the socket can stay quiet for a long time.
    location = /ws {
        proxy_pass http://$bifrost_upstream;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Sign-in through UniBridge (unibridge-service app/routers/bifrost_sso.py):
    # trades the one-time code the Bifrost button gets for a Bifrost session
    # cookie on this host. Here only, not in tls-proxy.conf: the cookie has to
    # be set on BIFROST_UI_HOSTNAME.
    location = /_unibridge/sso {
        set $unibridge_upstream "__UNIBRIDGE_SERVICE_UPSTREAM__";
        proxy_pass http://$unibridge_upstream:8000/bifrost/sso$is_args$args;
        # The service checks Host, so the cookie can only land on this name.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Same trust boundary as /_api/ in nginx.conf: only APISIX asserts these.
        proxy_set_header X-Consumer-Username "";
        proxy_set_header X-Consumer-Custom-Id "";
        proxy_set_header X-UniBridge-Internal-Proxy "";
    }

    location / {
        return 404;
    }
}
