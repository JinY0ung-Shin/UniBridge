# Whether LiteLLM and its database run, by LLM_GATEWAY. The litellm and
# litellm-db services in docker-compose.yml and docker-compose.infra.yml extend
# the service below that is named after the switch's value (unset or empty =
# litellm).
#
# - litellm: no profile, so both are part of every `up`.
# - bifrost: a profile nothing enables, so a plain `up` neither starts nor
#   recreates them, and `config --services` (the blue/green deploy's infra
#   health gate) leaves them out. Commands that name them still reach them
#   (`up -d litellm-db litellm`, `stop litellm`), and containers that are
#   already running are left alone: scripts/deploy-bluegreen.sh stops them once
#   nothing forwards to LiteLLM. litellm-db's volume keeps LiteLLM's models and
#   keys for a switch back.
#
# Only these two lowercase values work. Any other (Bifrost, LITELLM, a typo)
# fails every compose command with
#   service "<value>" not found in ./litellm/compose-gate.yml
services:
  litellm: {}
  bifrost:
    profiles: ["litellm"]
